<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Runner Game - Custom Character</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #f7f7f7;
    color: #535353;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    transition: background-color 0.8s, color 0.8s;
  }
  body.dark {
    background-color: #202124;
    color: #e8eaed;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: transparent;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
  .controls-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 10px;
    font-size: 13px;
    font-weight: bold;
  }
  .touch-controls {
    display: none;
    margin-top: 15px;
    gap: 20px;
    width: 100%;
    justify-content: center;
  }
  .touch-btn {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    background: #e0e0e0;
    color: #333;
    border: 2px solid #535353;
    border-radius: 8px;
    touch-action: manipulation;
  }
  .touch-btn:active { background: #bbb; }
  body.dark .touch-btn { background: #3c4043; color: #fff; border-color: #888; }
  body.dark .touch-btn:active { background: #555; }
  @media (pointer: coarse), (max-width: 768px) {
    .touch-controls { display: flex; }
    .hint-text { display: none; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="240"></canvas>
  <div class="controls-bar">
    <span class="hint-text">Nhấn <b>SPACE</b> / <b>↑</b>: Nhảy | <b>↓</b>: Cúi</span>
    <span id="sound-btn" style="cursor: pointer;">🔊 Âm thanh: BẬT</span>
  </div>
  <div class="touch-controls">
    <button class="touch-btn" id="btn-duck">CÚI (DUCK)</button>
    <button class="touch-btn" id="btn-jump">NHẢY (JUMP)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const soundBtn = document.getElementById('sound-btn');
const btnJump = document.getElementById('btn-jump');
const btnDuck = document.getElementById('btn-duck');

// Tải hình ảnh nhân vật
const charImg = new Image();
charImg.src = 'character.png'; // Đường dẫn file ảnh trên repo

let soundEnabled = true;
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Âm thanh: BẬT' : '🔈 Âm thanh: TẮT';
});

// Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBeep(freq, type, duration, delay = 0) {
  if (!soundEnabled) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  } catch (e) {}
}

const GROUND_Y = 195;
let speed = 6;
let score = 0;
let highScore = localStorage.getItem('dino_hi') || 0;
let isGameOver = false;
let isStarted = false;
let frameCount = 0;
let nightMode = false;

// Kích thước nhân vật
const CHAR_NORMAL_SIZE = 48;
const CHAR_DUCK_W = 54;
const CHAR_DUCK_H = 30;

const player = {
  x: 50,
  y: GROUND_Y - CHAR_NORMAL_SIZE,
  w: CHAR_NORMAL_SIZE,
  h: CHAR_NORMAL_SIZE,
  dy: 0,
  gravity: 0.65,
  jumpPower: -11.5,
  isGrounded: true,
  isDucking: false,
  bobAngle: 0
};

let obstacles = [];
let clouds = [
  { x: 300, y: 40, speed: 0.5 },
  { x: 620, y: 70, speed: 0.4 }
];
let groundOffset = 0;

function jump() {
  initAudio();
  if (isGameOver) { resetGame(); return; }
  if (!isStarted) { isStarted = true; }
  if (player.isGrounded && !player.isDucking) {
    player.dy = player.jumpPower;
    player.isGrounded = false;
    playBeep(440, 'square', 0.09);
  }
}

function setDuck(val) {
  if (!isStarted || isGameOver) return;
  player.isDucking = val;
  if (val && !player.isGrounded) {
    player.dy += 4;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    setDuck(true);
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') setDuck(false);
});

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnDuck.addEventListener('pointerdown', (e) => { e.preventDefault(); setDuck(true); });
btnDuck.addEventListener('pointerup', (e) => { e.preventDefault(); setDuck(false); });

function spawnObstacle() {
  const minGap = 210 + speed * 15;
  const lastObs = obstacles[obstacles.length - 1];
  if (lastObs && canvas.width - lastObs.x < minGap) return;

  const rand = Math.random();
  if (score > 250 && rand < 0.3) {
    const flightHeights = [GROUND_Y - 25, GROUND_Y - 50, GROUND_Y - 72];
    obstacles.push({
      type: 'bird',
      x: canvas.width,
      y: flightHeights[Math.floor(Math.random() * flightHeights.length)],
      w: 36,
      h: 24,
      flap: 0
    });
  } else {
    // Xương rồng
    const cWidths = [18, 32, 22];
    const cHeights = [38, 42, 48];
    const idx = Math.floor(Math.random() * cWidths.length);
    obstacles.push({
      type: 'cactus',
      x: canvas.width,
      y: GROUND_Y - cHeights[idx],
      w: cWidths[idx],
      h: cHeights[idx]
    });
  }
}

function update() {
  if (!isStarted || isGameOver) return;
  frameCount++;

  player.dy += player.gravity;
  player.y += player.dy;

  const curH = player.isDucking ? CHAR_DUCK_H : CHAR_NORMAL_SIZE;

  if (player.y >= GROUND_Y - curH) {
    player.y = GROUND_Y - curH;
    player.dy = 0;
    player.isGrounded = true;
  }

  // Nhịp chân nhún nhảy khi chạy
  if (player.isGrounded) {
    player.bobAngle += 0.25;
  }

  if (frameCount % 4 === 0) {
    score++;
    if (score % 100 === 0) {
      playBeep(880, 'square', 0.08);
      setTimeout(() => playBeep(1100, 'square', 0.12), 90);
    }
    if (score % 400 === 0) {
      nightMode = !nightMode;
      document.body.classList.toggle('dark', nightMode);
    }
  }
  speed = 6 + Math.min(score * 0.005, 8.5);

  groundOffset = (groundOffset + speed) % 24;
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -60) { c.x = canvas.width + 40; c.y = 25 + Math.random() * 50; }
  });

  if (Math.random() < 0.035) spawnObstacle();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.x -= speed;
    if (ob.type === 'bird' && frameCount % 12 === 0) {
      ob.flap = 1 - ob.flap;
    }

    const curW = player.isDucking ? CHAR_DUCK_W : CHAR_NORMAL_SIZE;
    const pHitBox = { x: player.x + 6, y: player.y + 4, w: curW - 12, h: curH - 6 };
    const oHitBox = { x: ob.x + 4, y: ob.y + 4, w: ob.w - 8, h: ob.h - 6 };

    if (
      pHitBox.x < oHitBox.x + oHitBox.w &&
      pHitBox.x + pHitBox.w > oHitBox.x &&
      pHitBox.y < oHitBox.y + oHitBox.h &&
      pHitBox.y + pHitBox.h > oHitBox.y
    ) {
      gameOver();
    }

    if (ob.x + ob.w < -10) obstacles.splice(i, 1);
  }
}

function gameOver() {
  isGameOver = true;
  playBeep(180, 'sawtooth', 0.25);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dino_hi', highScore);
  }
}

function resetGame() {
  obstacles = [];
  score = 0;
  speed = 6;
  isGameOver = false;
  frameCount = 0;
  player.y = GROUND_Y - CHAR_NORMAL_SIZE;
  player.dy = 0;
  player.isGrounded = true;
  player.isDucking = false;
  nightMode = false;
  document.body.classList.remove('dark');
}

// Vẽ nhân vật hình tròn hoặc bo góc kèm viền
function drawCharacter() {
  ctx.save();
  const curW = player.isDucking ? CHAR_DUCK_W : CHAR_NORMAL_SIZE;
  const curH = player.isDucking ? CHAR_DUCK_H : CHAR_NORMAL_SIZE;
  const cx = player.x + curW / 2;
  const cy = player.y + curH / 2;

  ctx.translate(cx, cy);

  // Xoay nhẹ hoặc nghiêng người khi nhảy hoặc cúi
  if (isGameOver) {
    ctx.rotate(0.3); // Ngã gục khi Game Over
  } else if (!player.isGrounded) {
    ctx.rotate(-0.1);
  } else if (player.isDucking) {
    ctx.rotate(0.05);
  } else {
    // Nhún nhẹ khi chạy
    ctx.rotate(Math.sin(player.bobAngle) * 0.06);
  }

  // Cắt hình tròn / oval bo tròn
  ctx.beginPath();
  ctx.ellipse(0, 0, curW / 2, curH / 2, 0, 0, Math.PI * 2);
  ctx.closePath();

  // Đổ bóng & vẽ ảnh
  ctx.save();
  ctx.clip();
  if (charImg.complete && charImg.naturalWidth > 0) {
    ctx.drawImage(charImg, -curW / 2, -curH / 2, curW, curH);
  } else {
    // Dự phòng nếu chưa tải ảnh: vẽ khối tròn màu cam
    ctx.fillStyle = '#ff7675';
    ctx.fillRect(-curW / 2, -curH / 2, curW, curH);
  }
  ctx.restore();

  // Vẽ viền tròn nổi bật quanh nhân vật
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = nightMode ? '#e8eaed' : '#535353';
  ctx.stroke();

  // Vẽ chân bước nhỏ bên dưới khi đứng chạy
  if (player.isGrounded && !player.isDucking && !isGameOver) {
    ctx.fillStyle = nightMode ? '#e8eaed' : '#535353';
    const legOffset = Math.sin(player.bobAngle) * 4;
    ctx.fillRect(-8, curH / 2 - 2, 4, 6 + legOffset);
    ctx.fillRect(4, curH / 2 - 2, 4, 6 - legOffset);
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const color = nightMode ? '#e8eaed' : '#535353';

  // 1. Mây
  ctx.fillStyle = color;
  clouds.forEach(c => {
    ctx.fillRect(c.x, c.y, 44, 10);
    ctx.fillRect(c.x + 12, c.y - 6, 22, 6);
  });

  // 2. Mặt đất
  ctx.fillRect(0, GROUND_Y, canvas.width, 2);
  for (let x = -groundOffset; x < canvas.width; x += 24) {
    if ((x * 7) % 5 === 0) ctx.fillRect(x + 2, GROUND_Y + 4, 3, 2);
    if ((x * 11) % 7 === 0) ctx.fillRect(x + 10, GROUND_Y + 8, 4, 2);
  }

  // 3. Nhân vật
  drawCharacter();

  // 4. Chướng ngại vật
  obstacles.forEach(ob => {
    ctx.fillStyle = color;
    if (ob.type === 'cactus') {
      ctx.fillRect(ob.x + ob.w / 2 - 3, ob.y, 6, ob.h);
      ctx.fillRect(ob.x, ob.y + 8, ob.w, 4);
      ctx.fillRect(ob.x, ob.y + 4, 4, 8);
      ctx.fillRect(ob.x + ob.w - 4, ob.y + 4, 4, 8);
    } else if (ob.type === 'bird') {
      ctx.fillRect(ob.x + 6, ob.y + 8, 24, 8);
      ctx.fillRect(ob.x, ob.y + 10, 8, 6);
      if (ob.flap === 0) {
        ctx.fillRect(ob.x + 12, ob.y - 2, 8, 10);
      } else {
        ctx.fillRect(ob.x + 12, ob.y + 14, 8, 10);
      }
    }
  });

  // 5. Điểm số
  ctx.fillStyle = color;
  ctx.font = '16px "Courier New", Courier, monospace';
  ctx.textAlign = 'right';
  const scoreStr = String(score).padStart(5, '0');
  const hiStr = String(highScore).padStart(5, '0');
  ctx.fillText(`HI ${hiStr}  ${scoreStr}`, canvas.width - 15, 25);

  if (!isStarted) {
    ctx.textAlign = 'center';
    ctx.fillText('NHẤN PHÍM CÁCH HOẶC CHẠM MÀN HÌNH ĐỂ BẮT ĐẦU', canvas.width / 2, GROUND_Y - 60);
  } else if (isGameOver) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", Courier, monospace';
    ctx.fillText('G A M E   O V E R', canvas.width / 2, GROUND_Y - 70);
    ctx.font = '14px "Courier New", Courier, monospace';
    ctx.fillText('↺ Nhấn Phím Cách hoặc chạm màn hình để chơi lại', canvas.width / 2, GROUND_Y - 40);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
