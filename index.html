<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classic Snake Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    outline: none;
  }
  #game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    outline: none;
  }
  .header-bar {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #00ff88;
  }
  .speed-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .speed-btn {
    padding: 4px 10px;
    background: #2a2a2a;
    color: #888;
    border: 1px solid #444;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .speed-btn.active {
    background: #00ff88;
    color: #111;
    font-weight: bold;
    border-color: #00ff88;
  }
  canvas {
    background-color: #0f1410;
    border: 3px solid #00ff88;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    display: block;
    outline: none;
  }
  .hint-text {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
  }
  .d-pad {
    display: none;
    margin-top: 14px;
    width: 180px;
    height: 140px;
    position: relative;
  }
  .d-btn {
    position: absolute;
    width: 52px;
    height: 44px;
    background: #2a2a2a;
    color: #00ff88;
    border: 2px solid #00ff88;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .d-btn:active { background: #00ff88; color: #1a1a1a; }
  #btn-up { top: 0; left: 64px; }
  #btn-left { top: 48px; left: 8px; }
  #btn-right { top: 48px; left: 120px; }
  #btn-down { bottom: 0; left: 64px; }

  @media (pointer: coarse), (max-width: 768px) {
    .d-pad { display: block; }
    .hint-text { display: none; }
  }
</style>
</head>
<body tabindex="0">

<div id="game-wrapper" tabindex="0">
  <div class="header-bar">
    <span id="score-text">ĐIỂM: 0</span>
    <span id="hi-text">KỶ LỤC: 0</span>
  </div>

  <!-- Bộ chọn tốc độ -->
  <div class="speed-selector">
    <button class="speed-btn" data-speed="100">Bình thường</button>
    <button class="speed-btn active" data-speed="70">⚡ Nhanh</button>
    <button class="speed-btn" data-speed="48">🔥 Siêu tốc</button>
  </div>
  
  <canvas id="gameCanvas" width="400" height="400" tabindex="0"></canvas>
  
  <div class="hint-text">
    Dùng <b>4 phím Mũi Tên</b> hoặc <b>W, A, S, D</b> để di chuyển
  </div>

  <div class="d-pad">
    <button class="d-btn" id="btn-up">↑</button>
    <button class="d-btn" id="btn-left">←</button>
    <button class="d-btn" id="btn-right">→</button>
    <button class="d-btn" id="btn-down">↓</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('score-text');
const hiText = document.getElementById('hi-text');
const speedBtns = document.querySelectorAll('.speed-btn');

window.addEventListener('load', () => { window.focus(); document.body.focus(); });
window.addEventListener('mouseenter', () => window.focus());
document.addEventListener('click', () => window.focus());

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, duration) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

const GRID_SIZE = 20;
const CELL_COUNT = canvas.width / GRID_SIZE;

let baseSpeed = 70; // Mặc định chế độ "Nhanh" (70ms mỗi ô)
let currentSpeed = baseSpeed;
let snake = [];
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let food = { x: 15, y: 10 };
let bonusFood = null;
let bonusTimer = 0;
let score = 0;
let highScore = localStorage.getItem('snake_hi') || 0;
let isGameOver = false;
let isStarted = false;
let lastUpdateTime = 0;

hiText.textContent = `KỶ LỤC: ${highScore}`;

// Lựa chọn tốc độ
speedBtns.forEach(btn => {
  btn.addEventListener('click', (e) => {
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    baseSpeed = parseInt(btn.dataset.speed);
    currentSpeed = baseSpeed;
    btn.blur();
    window.focus();
  });
});

function resetGame() {
  snake = [
    { x: 5, y: 10 },
    { x: 4, y: 10 },
    { x: 3, y: 10 }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  currentSpeed = baseSpeed;
  isGameOver = false;
  isStarted = true;
  bonusFood = null;
  scoreText.textContent = `ĐIỂM: ${score}`;
  spawnFood();
}

function spawnFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * CELL_COUNT),
      y: Math.floor(Math.random() * CELL_COUNT)
    };
    valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
  }

  if (!bonusFood && Math.random() < 0.25 && score > 30) {
    let bValid = false;
    let bPos;
    while (!bValid) {
      bPos = {
        x: Math.floor(Math.random() * CELL_COUNT),
        y: Math.floor(Math.random() * CELL_COUNT)
      };
      bValid = !snake.some(s => s.x === bPos.x && s.y === bPos.y) && (bPos.x !== food.x || bPos.y !== food.y);
    }
    bonusFood = bPos;
    bonusTimer = 45;
  }
}

function changeDirection(dx, dy) {
  initAudio();
  if (!isStarted || isGameOver) {
    resetGame();
    return;
  }
  if (dx !== -dir.x && dy !== -dir.y) {
    nextDir = { x: dx, y: dy };
  }
}

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); changeDirection(0, -1); }
  else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); changeDirection(0, 1); }
  else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); changeDirection(-1, 0); }
  else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); changeDirection(1, 0); }
  else if (e.code === 'Space' && (!isStarted || isGameOver)) { e.preventDefault(); resetGame(); }
}, { passive: false });

document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(0, -1); });
document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(0, 1); });
document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(-1, 0); });
document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); changeDirection(1, 0); });
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!isStarted || isGameOver) resetGame();
});

function update() {
  if (!isStarted || isGameOver) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= CELL_COUNT || head.y < 0 || head.y >= CELL_COUNT) {
    triggerGameOver();
    return;
  }

  if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
    triggerGameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreText.textContent = `ĐIỂM: ${score}`;
    playTone(600, 'square', 0.08);
    // Càng ăn càng tăng tốc độ tối đa xuống tới 35ms/bước
    if (currentSpeed > 35) currentSpeed -= 1.2;
    spawnFood();
  } else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
    score += 35;
    scoreText.textContent = `ĐIỂM: ${score}`;
    playTone(900, 'square', 0.15);
    bonusFood = null;
  } else {
    snake.pop();
  }

  if (bonusFood) {
    bonusTimer--;
    if (bonusTimer <= 0) bonusFood = null;
  }
}

function triggerGameOver() {
  isGameOver = true;
  playTone(160, 'sawtooth', 0.35);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snake_hi', highScore);
    hiText.textContent = `KỶ LỤC: ${highScore}`;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Lưới
  ctx.strokeStyle = '#141e17';
  ctx.lineWidth = 1;
  for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
  }

  // Mồi đỏ
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.arc(food.x * GRID_SIZE + 10, food.y * GRID_SIZE + 10, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2ed573';
  ctx.fillRect(food.x * GRID_SIZE + 9, food.y * GRID_SIZE + 2, 2, 4);

  // Mồi vàng
  if (bonusFood) {
    if (bonusTimer > 15 || Math.floor(bonusTimer / 2) % 2 === 0) {
      ctx.fillStyle = '#ffa502';
      ctx.beginPath();
      ctx.arc(bonusFood.x * GRID_SIZE + 10, bonusFood.y * GRID_SIZE + 10, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('★', bonusFood.x * GRID_SIZE + 10, bonusFood.y * GRID_SIZE + 14);
    }
  }

  // Thân rắn
  snake.forEach((segment, idx) => {
    if (idx === 0) {
      ctx.fillStyle = '#00ff88';
      ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      ctx.fillStyle = '#111';
      if (dir.x === 1) {
        ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 4, 3, 3);
        ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 13, 3, 3);
      } else if (dir.x === -1) {
        ctx.fillRect(segment.x * GRID_SIZE + 5, segment.y * GRID_SIZE + 4, 3, 3);
        ctx.fillRect(segment.x * GRID_SIZE + 5, segment.y * GRID_SIZE + 13, 3, 3);
      } else if (dir.y === -1) {
        ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 5, 3, 3);
        ctx.fillRect(segment.x * GRID_SIZE + 13, segment.y * GRID_SIZE + 5, 3, 3);
      } else {
        ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 12, 3, 3);
        ctx.fillRect(segment.x * GRID_SIZE + 13, segment.y * GRID_SIZE + 12, 3, 3);
      }
    } else {
      ctx.fillStyle = idx % 2 === 0 ? '#10ac84' : '#1dd1a1';
      ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
    }
  });

  if (!isStarted) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 20px "Courier New", Courier, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RẮN SĂN MỒI', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '13px "Courier New", Courier, monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Nhấn Phím Mũi Tên để Chơi', canvas.width / 2, canvas.height / 2 + 15);
  } else if (isGameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 24px "Courier New", Courier, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '13px "Courier New", Courier, monospace';
    ctx.fillStyle = '#00ff88';
    ctx.fillText(`Tổng điểm: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillStyle = '#aaa';
    ctx.fillText('Nhấn Mũi Tên hoặc chạm để chơi lại', canvas.width / 2, canvas.height / 2 + 35);
  }
}

function gameLoop(currentTime) {
  if (currentTime - lastUpdateTime >= currentSpeed) {
    update();
    lastUpdateTime = currentTime;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

resetGame();
isStarted = false;
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
