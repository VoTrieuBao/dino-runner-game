<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10 Màn Tìm Điểm Khác Biệt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #f1f2f6;
    color: #2f3542;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 10px;
  }
  .header { text-align: center; margin-bottom: 8px; }
  h2 { font-size: 20px; color: #2ed573; margin-bottom: 2px; }
  .badge-diff {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .diff-easy { background: #2ed573; color: white; }
  .diff-med { background: #ffa502; color: white; }
  .diff-hard { background: #ff4757; color: white; }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 760px;
    background: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 14px;
  }
  .btn-hint {
    background: #ffa502;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-hint:active { background: #eccc68; }
  .canvas-container {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card-box {
    position: relative;
    background: white;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .card-label {
    text-align: center;
    font-weight: bold;
    font-size: 13px;
    padding: 3px 0;
    color: #57606f;
  }
  canvas {
    display: block;
    cursor: crosshair;
    border-radius: 6px;
  }
  .modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 24px 32px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    text-align: center;
    z-index: 100;
    max-width: 90%;
  }
  .modal h3 { color: #2ed573; font-size: 22px; margin-bottom: 8px; }
  .modal button {
    margin-top: 14px;
    padding: 8px 20px;
    background: #2ed573;
    border: none;
    color: white;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <h2>🔍 THỬ THÁCH 10 MÀN TÌM ĐIỂM KHÁC NHAU</h2>
  <span id="level-title" style="font-size: 13px; color: #747d8c;">Màn 1: Ngôi nhà thảo nguyên</span>
</div>

<div class="status-bar">
  <div>Màn: <span id="level-display" style="color: #3742fa;">1</span>/10 <span id="diff-badge" class="badge-diff diff-easy">DỄ</span></div>
  <div>Đã tìm: <span id="found-count" style="color: #ff4757;">0</span>/<span id="total-count">4</span></div>
  <div>⏱️ <span id="timer">00:00</span></div>
  <button class="btn-hint" id="btn-hint">💡 Gợi ý (5)</button>
</div>

<div class="canvas-container">
  <div class="card-box">
    <div class="card-label">HÌNH A</div>
    <canvas id="canvasA" width="360" height="270"></canvas>
  </div>
  <div class="card-box">
    <div class="card-label">HÌNH B</div>
    <canvas id="canvasB" width="360" height="270"></canvas>
  </div>
</div>

<div class="modal" id="winModal">
  <h3 id="modalTitle">🎉 XUẤT SẮC!</h3>
  <p id="winMsg">Bạn đã tìm thấy tất cả các điểm khác nhau!</p>
  <button id="btn-next">Sang Màn Kế Tiếp ➔</button>
</div>

<script>
const canvasA = document.getElementById('canvasA');
const canvasB = document.getElementById('canvasB');
const ctxA = canvasA.getContext('2d');
const ctxB = canvasB.getContext('2d');

const foundCountEl = document.getElementById('found-count');
const totalCountEl = document.getElementById('total-count');
const timerEl = document.getElementById('timer');
const hintBtn = document.getElementById('btn-hint');
const levelEl = document.getElementById('level-display');
const diffBadge = document.getElementById('diff-badge');
const levelTitle = document.getElementById('level-title');
const winModal = document.getElementById('winModal');
const btnNext = document.getElementById('btn-next');

// Âm thanh
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(freq, duration, type='sine') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

let curLevel = 0;
let hintsLeft = 5;
let seconds = 0;
let timerInterval = null;

// =================== DANH SÁCH 10 MÀN CHƠI ===================
const levels = [
  // MÀN 1 (Dễ - 3 điểm)
  {
    name: "Màn 1: Ngôi nhà ban trưa",
    diffText: "DỄ",
    diffClass: "diff-easy",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,360,160);
      ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,160,360,110);
      // Mặt trời (Điểm 1: Vàng vs Cam)
      ctx.fillStyle = isB ? '#FF5722' : '#FFEB3B';
      ctx.beginPath(); ctx.arc(60, 50, 24, 0, Math.PI*2); ctx.fill();
      // Mây (Điểm 2: B mất 1 đám mây)
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(170, 45, 14, 0, Math.PI*2); ctx.arc(190, 40, 18, 0, Math.PI*2); ctx.fill();
      if (!isB) { ctx.beginPath(); ctx.arc(280, 50, 16, 0, Math.PI*2); ctx.arc(300, 45, 18, 0, Math.PI*2); ctx.fill(); }
      // Nhà
      ctx.fillStyle = '#FF9800'; ctx.fillRect(140, 130, 80, 70);
      // Mái nhà (Điểm 3: Đỏ vs Xanh tím)
      ctx.fillStyle = isB ? '#673AB7' : '#E91E63';
      ctx.beginPath(); ctx.moveTo(130,130); ctx.lineTo(180,85); ctx.lineTo(230,130); ctx.fill();
      // Cửa
      ctx.fillStyle = '#795548'; ctx.fillRect(170, 160, 20, 40);
    },
    differences: [
      { id:1, x: 60, y: 50, r: 25, hint: "Màu sắc mặt trời" },
      { id:2, x: 290, y: 48, r: 24, hint: "Đám mây góc bên phải" },
      { id:3, x: 180, y: 105, r: 24, hint: "Màu của mái nhà" }
    ]
  },
  // MÀN 2 (Dễ - 3 điểm)
  {
    name: "Màn 2: Thuyền buồm đại dương",
    diffText: "DỄ",
    diffClass: "diff-easy",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#FFE082'; ctx.fillRect(0,0,360,160);
      ctx.fillStyle = '#0288D1'; ctx.fillRect(0,160,360,110);
      // Hải đăng bên trái (Điểm 1: B có tia sáng đèn)
      ctx.fillStyle = '#E53935'; ctx.fillRect(40, 110, 20, 60);
      if (isB) { ctx.fillStyle = 'rgba(255, 235, 59, 0.8)'; ctx.beginPath(); ctx.moveTo(60,115); ctx.lineTo(130,90); ctx.lineTo(130,140); ctx.fill(); }
      // Thuyền
      ctx.fillStyle = '#6D4C41'; ctx.beginPath(); ctx.moveTo(180,195); ctx.lineTo(260,195); ctx.lineTo(240,215); ctx.lineTo(200,215); ctx.fill();
      // Cánh buồm (Điểm 2: Trắng vs Xanh lá)
      ctx.fillStyle = isB ? '#4CAF50' : '#FFF';
      ctx.beginPath(); ctx.moveTo(220,135); ctx.lineTo(220,190); ctx.lineTo(255,190); ctx.fill();
      // Chim bay (Điểm 3: B có 1 chú cá nhảy lên ở góc phải)
      if (isB) { ctx.fillStyle = '#81D4FA'; ctx.beginPath(); ctx.arc(310, 185, 10, 0, Math.PI); ctx.fill(); }
    },
    differences: [
      { id:1, x: 95, y: 115, r: 25, hint: "Ánh sáng ngọn hải đăng" },
      { id:2, x: 235, y: 165, r: 22, hint: "Màu cánh buồm thuyền" },
      { id:3, x: 310, y: 185, r: 18, hint: "Mặt nước bên phải thuyền" }
    ]
  },
  // MÀN 3 (Dễ - 4 điểm)
  {
    name: "Màn 3: Người tuyết mùa đông",
    diffText: "DỄ",
    diffClass: "diff-easy",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#37474F'; ctx.fillRect(0,0,360,270);
      // Nền tuyết
      ctx.fillStyle = '#ECEFF1'; ctx.beginPath(); ctx.arc(180, 360, 200, 0, Math.PI*2); ctx.fill();
      // Thân người tuyết
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(180, 195, 45, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(180, 130, 32, 0, Math.PI*2); ctx.fill();
      // Điểm 1: Mũ người tuyết (Đen vs Đỏ)
      ctx.fillStyle = isB ? '#E53935' : '#263238';
      ctx.fillRect(162, 75, 36, 25); ctx.fillRect(152, 100, 56, 6);
      // Điểm 2: Khăn quàng (B có sọc vàng)
      ctx.fillStyle = '#1E88E5'; ctx.fillRect(158, 155, 44, 12);
      if (isB) { ctx.fillStyle = '#FFD54F'; ctx.fillRect(174, 155, 12, 12); }
      // Điểm 3: Cúc áo (3 cúc vs 2 cúc)
      ctx.fillStyle = '#212121';
      ctx.beginPath(); ctx.arc(180, 180, 4, 0, Math.PI*2); ctx.fill();
      if (!isB) { ctx.beginPath(); ctx.arc(180, 198, 4, 0, Math.PI*2); ctx.fill(); }
      ctx.beginPath(); ctx.arc(180, 216, 4, 0, Math.PI*2); ctx.fill();
      // Điểm 4: Ngôi sao trên trời đêm góc phải (B thiếu 1 ngôi sao)
      ctx.fillStyle = '#FFEB3B';
      ctx.fillRect(60, 40, 5, 5);
      if (!isB) ctx.fillRect(290, 45, 6, 6);
    },
    differences: [
      { id:1, x: 180, y: 88, r: 24, hint: "Màu chiếc mũ người tuyết" },
      { id:2, x: 180, y: 161, r: 16, hint: "Họa tiết khăn quàng cổ" },
      { id:3, x: 180, y: 198, r: 14, hint: "Hàng cúc áo giữa thân" },
      { id:4, x: 290, y: 48, r: 16, hint: "Ngôi sao góc trên bên phải" }
    ]
  },
  // MÀN 4 (Trung bình - 4 điểm)
  {
    name: "Màn 4: Khám phá Vũ trụ",
    diffText: "VỪA",
    diffClass: "diff-med",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#0B0B2A'; ctx.fillRect(0,0,360,270);
      // Sao Thổ (Điểm 1: Vành đai có đốm sáng nhỏ ở B)
      ctx.fillStyle = '#FFB74D'; ctx.beginPath(); ctx.arc(80, 80, 28, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = isB ? '#E91E63' : '#FFF'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(80, 80, 45, 12, Math.PI/6, 0, Math.PI*2); ctx.stroke();
      // Tàu vũ trụ Rocket
      ctx.fillStyle = '#E0E0E0'; ctx.beginPath(); ctx.ellipse(230, 160, 45, 20, -Math.PI/4, 0, Math.PI*2); ctx.fill();
      // Điểm 2: Cánh tên lửa (Đỏ vs Xanh dương)
      ctx.fillStyle = isB ? '#29B6F6' : '#F44336';
      ctx.beginPath(); ctx.moveTo(250, 190); ctx.lineTo(270, 205); ctx.lineTo(250, 205); ctx.fill();
      // Điểm 3: Cửa sổ phi thuyền (B có phi hành gia vẫy tay chấm trắng)
      ctx.fillStyle = '#00E5FF'; ctx.beginPath(); ctx.arc(220, 150, 8, 0, Math.PI*2); ctx.fill();
      if (isB) { ctx.fillStyle = '#FFF'; ctx.fillRect(218, 148, 4, 4); }
      // Điểm 4: Thiên thạch góc dưới bên trái (B thiếu mất)
      if (!isB) { ctx.fillStyle = '#8D6E63'; ctx.beginPath(); ctx.arc(60, 220, 14, 0, Math.PI*2); ctx.fill(); }
    },
    differences: [
      { id:1, x: 80, y: 80, r: 25, hint: "Màu vành đai hành tinh" },
      { id:2, x: 258, y: 198, r: 18, hint: "Màu cánh đuôi phi thuyền" },
      { id:3, x: 220, y: 150, r: 14, hint: "Ô cửa kính tròn phi thuyền" },
      { id:4, x: 60, y: 220, r: 18, hint: "Thiên thạch góc dưới bên trái" }
    ]
  },
  // MÀN 5 (Trung bình - 5 điểm)
  {
    name: "Màn 5: Sa mạc Ai Cập",
    diffText: "VỪA",
    diffClass: "diff-med",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#FFE082'; ctx.fillRect(0,0,360,150);
      ctx.fillStyle = '#FFB300'; ctx.fillRect(0,150,360,120);
      // Kim tự tháp lớn
      ctx.fillStyle = '#FFA000'; ctx.beginPath(); ctx.moveTo(140, 170); ctx.lineTo(210, 80); ctx.lineTo(280, 170); ctx.fill();
      // Điểm 1: Đỉnh kim tự tháp (B mạ vàng sáng)
      if (isB) { ctx.fillStyle = '#FFF9C4'; ctx.beginPath(); ctx.moveTo(195, 100); ctx.lineTo(210, 80); ctx.lineTo(225, 100); ctx.fill(); }
      // Kim tự tháp nhỏ
      ctx.fillStyle = '#FF8F00'; ctx.beginPath(); ctx.moveTo(70, 170); ctx.lineTo(120, 110); ctx.lineTo(170, 170); ctx.fill();
      // Điểm 2: Cây dừa bên trái (B thiếu 1 quả dừa)
      ctx.fillStyle = '#6D4C41'; ctx.fillRect(45, 160, 8, 50);
      ctx.fillStyle = '#388E3C'; ctx.beginPath(); ctx.arc(49, 155, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3E2723';
      ctx.beginPath(); ctx.arc(43, 160, 3, 0, Math.PI*2); ctx.fill();
      if (!isB) { ctx.beginPath(); ctx.arc(55, 160, 3, 0, Math.PI*2); ctx.fill(); }
      // Điểm 3: Con lạc đà (B có thêm chiếc túi trên lưng)
      ctx.fillStyle = '#5D4037'; ctx.fillRect(290, 190, 24, 14); // thân
      ctx.fillRect(310, 178, 6, 16); // cổ
      if (isB) { ctx.fillStyle = '#D32F2F'; ctx.fillRect(295, 185, 12, 6); }
      // Điểm 4: Bụi cỏ khô lăn góc dưới (B không có)
      if (!isB) { ctx.fillStyle = '#A1887F'; ctx.beginPath(); ctx.arc(130, 230, 8, 0, Math.PI*2); ctx.fill(); }
      // Điểm 5: Vệt mây sa mạc (B thiếu)
      if (!isB) { ctx.fillStyle = '#FFF'; ctx.fillRect(280, 40, 35, 4); }
    },
    differences: [
      { id:1, x: 210, y: 92, r: 18, hint: "Chóp nhọn của kim tự tháp" },
      { id:2, x: 55, y: 160, r: 14, hint: "Quả dừa trên cây góc trái" },
      { id:3, x: 300, y: 188, r: 16, hint: "Lưng chú lạc đà" },
      { id:4, x: 130, y: 230, r: 15, hint: "Bụi cỏ khô góc dưới" },
      { id:5, x: 295, y: 42, r: 18, hint: "Vệt mây góc trên bên phải" }
    ]
  },
  // MÀN 6 (Trung bình - 5 điểm)
  {
    name: "Màn 6: Bàn học sáng tạo",
    diffText: "VỪA",
    diffClass: "diff-med",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#ECEFF1'; ctx.fillRect(0,0,360,170); // tường
      ctx.fillStyle = '#8D6E63'; ctx.fillRect(0,170,360,100); // mặt bàn
      // Đèn bàn (Điểm 1: Chao đèn Xanh vs Đỏ)
      ctx.fillStyle = isB ? '#E53935' : '#1E88E5';
      ctx.beginPath(); ctx.arc(60, 90, 22, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#424242'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(60,90); ctx.lineTo(70,170); ctx.stroke();
      // Máy tính laptop giữa bàn
      ctx.fillStyle = '#757575'; ctx.fillRect(140, 130, 80, 50); // màn hình
      ctx.fillStyle = isB ? '#4CAF50' : '#29B6F6'; ctx.fillRect(144, 134, 72, 42); // Điểm 2: Màu màn hình
      // Ống cắm bút bên phải
      ctx.fillStyle = '#FFA000'; ctx.fillRect(270, 150, 24, 35);
      // Điểm 3: Bút chì (B thiếu cây bút màu đỏ)
      ctx.fillStyle = '#424242'; ctx.fillRect(274, 135, 4, 20);
      if (!isB) { ctx.fillStyle = '#E91E63'; ctx.fillRect(284, 130, 4, 25); }
      // Điểm 4: Tách cà phê (B bốc khói)
      ctx.fillStyle = '#FFF'; ctx.fillRect(100, 195, 20, 18);
      if (isB) { ctx.strokeStyle = '#BDBDBD'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(110, 185, 4, 0, Math.PI); ctx.stroke(); }
      // Điểm 5: Đồng hồ treo tường (Kim chỉ 3h vs 6h)
      ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(310, 50, 20, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#212121'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(310, 50); ctx.lineTo(310, 38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(310, 50);
      if (isB) ctx.lineTo(310, 62); else ctx.lineTo(322, 50);
      ctx.stroke();
    },
    differences: [
      { id:1, x: 60, y: 90, r: 20, hint: "Màu chao đèn bàn" },
      { id:2, x: 180, y: 155, r: 24, hint: "Màu màn hình laptop" },
      { id:3, x: 284, y: 135, r: 16, hint: "Bút chì trong ống cắm" },
      { id:4, x: 110, y: 185, r: 15, hint: "Hơi khói tách cà phê" },
      { id:5, x: 310, y: 50, r: 18, hint: "Kim đồng hồ treo tường" }
    ]
  },
  // MÀN 7 (Khó - 5 điểm)
  {
    name: "Màn 7: Nông trại yên bình",
    diffText: "KHÓ",
    diffClass: "diff-hard",
    draw: function(ctx, isB) {
      ctx.fillStyle = '#B3E5FC'; ctx.fillRect(0,0,360,130);
      ctx.fillStyle = '#8BC34A'; ctx.fillRect(0,130,360,140);
      // Hàng rào gỗ
      ctx.fillStyle = '#D7CCC8';
      for(let x=10; x<350; x+=30) { ctx.fillRect(x, 140, 8, 30); }
      ctx.fillRect(0, 150, 360, 6);
      // Điểm 1: Một thanh rào ở vị trí x=160 bị mất đỉnh nhọn ở B
      if (isB) { ctx.clearRect(160, 138, 8, 6); }
      // Cối xay gió
      ctx.fillStyle = '#795548'; ctx.beginPath(); ctx.moveTo(270, 180); ctx.lineTo(285, 90); ctx.lineTo(300, 180); ctx.fill();
      // Điểm 2: Cánh cối xay gió (Thẳng vs Nghiêng 45 độ)
      ctx.strokeStyle = '#D32F2F'; ctx.lineWidth = 4; ctx.beginPath();
      if (isB) {
        ctx.moveTo(270, 75); ctx.lineTo(300, 105); ctx.moveTo(300, 75); ctx.lineTo(270, 105);
      } else {
        ctx.moveTo(285, 68); ctx.lineTo(285, 112); ctx.moveTo(263, 90); ctx.lineTo(307, 90);
      }
      ctx.stroke();
      // Con bò sữa
      ctx.fillStyle = '#FFF'; ctx.fillRect(80, 190, 40, 25); // thân
      ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(95, 200, 6, 0, Math.PI*2); ctx.fill(); // đốm 1
      // Điểm 3: Bò có thêm 1 đốm đen ở B
      if (isB) { ctx.beginPath(); ctx.arc(110, 205, 5, 0, Math.PI*2); ctx.fill(); }
      // Điểm 4: Đóa hoa hướng dương ở góc trái (B thiếu nhụy nâu)
      ctx.fillStyle = '#FBC02D'; ctx.beginPath(); ctx.arc(35, 235, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = isB ? '#FBC02D' : '#5D4037';
      ctx.beginPath(); ctx.arc(35, 235, 6, 0, Math.PI*2); ctx.fill();
      // Điểm 5: Đám cỏ lau góc phải dưới (B thiếu 1 lá)
      ctx.fillStyle = '#558B2F'; ctx.fillRect(230, 240, 4, 18); ctx.fillRect(238, 235, 4, 23);
      if (!isB) ctx.fillRect(246, 242, 4, 16);
    },
    differences: [
      { id:1, x: 164, y: 142, r: 15, hint: "Thanh hàng rào giữa tranh" },
      { id:2, x: 285, y: 90, r: 24, hint: "Góc quay của cánh cối xay gió" },
      { id:3, x: 110, y: 205, r: 15, hint: "Đốm đen trên thân chú bò" },

let foundList = [];

function loadLevel(lvl) {
  curLevel = lvl;
  foundList = [];
  const data = levels[curLevel];

  levelEl.textContent = curLevel + 1;
  levelTitle.textContent = data.name;
  diffBadge.textContent = data.diffText;
  diffBadge.className = 'badge-diff ' + data.diffClass;

  foundCountEl.textContent = 0;
  totalCountEl.textContent = data.differences.length;
  winModal.style.display = 'none';

  render();
}

function render() {
  const data = levels[curLevel];
  data.draw(ctxA, false);
  data.draw(ctxB, true);

  foundList.forEach(diff => {
    drawFoundCircle(ctxA, diff.x, diff.y, diff.r);
    drawFoundCircle(ctxB, diff.x, diff.y, diff.r);
  });
}

function drawFoundCircle(ctx, x, y, r) {
  ctx.save();
  ctx.strokeStyle = '#ff4757';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, r + 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function checkClick(x, y) {
  const currentDiffs = levels[curLevel].differences;
  for (let diff of currentDiffs) {
    if (foundList.includes(diff)) continue;

    const dist = Math.hypot(x - diff.x, y - diff.y);
    if (dist <= diff.r + 10) {
      foundList.push(diff);
      foundCountEl.textContent = foundList.length;

      // Tiếng chuông chúc mừng
      playSound(660, 0.1);
      setTimeout(() => playSound(880, 0.15), 100);

      render();

      if (foundList.length === currentDiffs.length) {
        setTimeout(showWin, 400);
      }
      return;
    }
  }
  // Click trượt
  playSound(220, 0.1, 'sawtooth');
}

function getCanvasCoords(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvasA.addEventListener('pointerdown', (e) => {
  const coords = getCanvasCoords(canvasA, e);
  checkClick(coords.x, coords.y);
});

canvasB.addEventListener('pointerdown', (e) => {
  const coords = getCanvasCoords(canvasB, e);
  checkClick(coords.x, coords.y);
});

// Nút gợi ý
hintBtn.addEventListener('click', () => {
  if (hintsLeft <= 0) {
    alert("Bạn đã hết lượt gợi ý cho phiên chơi này!");
    return;
  }
  const unfound = levels[curLevel].differences.filter(d => !foundList.includes(d));
  if (unfound.length > 0) {
    hintsLeft--;
    hintBtn.textContent = `💡 Gợi ý (${hintsLeft})`;
    const target = unfound[0];

    // Khoanh khung vuông nhấp nháy gợi ý
    ctxA.save(); ctxB.save();
    ctxA.strokeStyle = ctxB.strokeStyle = '#ffa502';
    ctxA.lineWidth = ctxB.lineWidth = 3;
    ctxA.strokeRect(target.x - target.r, target.y - target.r, target.r * 2, target.r * 2);
    ctxB.strokeRect(target.x - target.r, target.y - target.r, target.r * 2, target.r * 2);
    ctxA.restore(); ctxB.restore();

    playSound(520, 0.15);
  }
});

function showWin() {
  playSound(523, 0.15);
  setTimeout(() => playSound(659, 0.15), 150);
  setTimeout(() => playSound(784, 0.25), 300);

  if (curLevel + 1 < levels.length) {
    document.getElementById('modalTitle').textContent = `🎉 HOÀN THÀNH MÀN ${curLevel + 1}!`;
    document.getElementById('winMsg').textContent = `Xuất sắc! Chuẩn bị bước vào màn tiếp theo với độ khó cao hơn.`;
    btnNext.textContent = "Sang Màn Kế Tiếp ➔";
    btnNext.onclick = () => { loadLevel(curLevel + 1); };
  } else {
    document.getElementById('modalTitle').textContent = "🏆 ĐỈNH CAO THỊ GIÁC!";
    document.getElementById('winMsg').textContent = "Bạn đã vượt qua toàn bộ 10 màn chơi từ dễ đến siêu khó!";
    btnNext.textContent = "Chơi Lại Từ Đầu ↺";
    btnNext.onclick = () => { hintsLeft = 5; hintBtn.textContent = "💡 Gợi ý (5)"; loadLevel(0); };
  }
  winModal.style.display = 'block';
}

function startTimer() {
  seconds = 0;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

loadLevel(0);
startTimer();
</script>
