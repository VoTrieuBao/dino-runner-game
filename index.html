<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trò Chơi Tìm Điểm Khác Nhau</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #f1f2f6;
    color: #2f3542;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 10px;
  }
  .header {
    text-align: center;
    margin-bottom: 12px;
  }
  h2 { font-size: 20px; color: #2ed573; margin-bottom: 4px; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 760px;
    background: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 14px;
  }
  .btn-hint {
    background: #ffa502;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-hint:active { background: #eccc68; }
  .canvas-container {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card-box {
    position: relative;
    background: white;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .card-label {
    text-align: center;
    font-weight: bold;
    font-size: 13px;
    padding: 4px 0;
    color: #57606f;
  }
  canvas {
    display: block;
    cursor: crosshair;
    border-radius: 6px;
  }
  .modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 24px 32px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    text-align: center;
    z-index: 100;
  }
  .modal h3 { color: #2ed573; font-size: 22px; margin-bottom: 8px; }
  .modal button {
    margin-top: 14px;
    padding: 8px 20px;
    background: #2ed573;
    border: none;
    color: white;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <h2>🔍 TÌM 5 ĐIỂM KHÁC NHAU</h2>
  <span style="font-size: 13px; color: #747d8c;">So sánh hai bức ảnh và bấm vào những điểm khác biệt</span>
</div>

<div class="status-bar">
  <div>Màn: <span id="level-display" style="color: #3742fa;">1</span>/2</div>
  <div>Đã tìm: <span id="found-count" style="color: #ff4757;">0</span>/5</div>
  <div>⏱️ <span id="timer">00:00</span></div>
  <button class="btn-hint" id="btn-hint">💡 Gợi ý (3)</button>
</div>

<div class="canvas-container">
  <div class="card-box">
    <div class="card-label">ẢNH GỐC (BÊN TRÁI)</div>
    <canvas id="canvasA" width="360" height="280"></canvas>
  </div>
  <div class="card-box">
    <div class="card-label">ẢNH CÓ ĐIỂM KHÁC (BÊN PHẢI)</div>
    <canvas id="canvasB" width="360" height="280"></canvas>
  </div>
</div>

<div class="modal" id="winModal">
  <h3>🎉 XUẤT SẮC!</h3>
  <p id="winMsg">Bạn đã tìm thấy tất cả các điểm khác nhau!</p>
  <button id="btn-next">Tiếp tục màn sau ➔</button>
</div>

<script>
const canvasA = document.getElementById('canvasA');
const canvasB = document.getElementById('canvasB');
const ctxA = canvasA.getContext('2d');
const ctxB = canvasB.getContext('2d');

const foundCountEl = document.getElementById('found-count');
const timerEl = document.getElementById('timer');
const hintBtn = document.getElementById('btn-hint');
const levelEl = document.getElementById('level-display');
const winModal = document.getElementById('winModal');
const btnNext = document.getElementById('btn-next');

// Âm thanh Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(freq, duration, type='sine') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

let curLevel = 0;
let hintsLeft = 3;
let seconds = 0;
let timerInterval = null;

// Định nghĩa dữ liệu 2 màn chơi với các đặc điểm khác biệt
const levels = [
  {
    // MÀN 1: Ngôi nhà thảo nguyên và bầu trời
    drawBase: function(ctx, isDiff) {
      // Bầu trời
      ctx.fillStyle = '#70a1ff';
      ctx.fillRect(0, 0, 360, 160);
      // Đồi cỏ
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.arc(100, 260, 180, 0, Math.PI * 2);
      ctx.arc(280, 270, 170, 0, Math.PI * 2);
      ctx.fill();

      // Mặt trời (Điểm 1: Màn B đổi thành màu cam và có kính râm)
      ctx.fillStyle = isDiff ? '#ff7f50' : '#ffa502';
      ctx.beginPath();
      ctx.arc(60, 50, 24, 0, Math.PI * 2);
      ctx.fill();
      if (isDiff) {
        // Kính râm trên mặt trời
        ctx.fillStyle = '#2f3542';
        ctx.fillRect(52, 45, 18, 6);
      }

      // Đám mây (Điểm 2: Màn B thiếu 1 đám mây góc phải)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(170, 45, 14, 0, Math.PI*2);
      ctx.arc(190, 40, 18, 0, Math.PI*2);
      ctx.arc(210, 45, 14, 0, Math.PI*2);
      ctx.fill();

      if (!isDiff) {
        // Đám mây chỉ có ở ảnh A
        ctx.beginPath();
        ctx.arc(290, 55, 12, 0, Math.PI*2);
        ctx.arc(310, 50, 15, 0, Math.PI*2);
        ctx.arc(330, 55, 12, 0, Math.PI*2);
        ctx.fill();
      }

      // Ngôi nhà
      ctx.fillStyle = '#ffa502';
      ctx.fillRect(140, 140, 80, 70); // Thân nhà
      // Mái nhà (Điểm 3: Màu mái nhà đỏ vs xanh tím)
      ctx.fillStyle = isDiff ? '#9c88ff' : '#eb4d4b';
      ctx.beginPath();
      ctx.moveTo(130, 140);
      ctx.lineTo(180, 95);
      ctx.lineTo(230, 140);
      ctx.fill();

      // Cửa sổ nhà (Điểm 4: Màn B cửa sổ mở có hình chữ thập, màn A trơn)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(150, 155, 20, 20);
      if (isDiff) {
        ctx.fillStyle = '#333';
        ctx.fillRect(159, 155, 2, 20);
        ctx.fillRect(150, 164, 20, 2);
      }

      // Cửa chính
      ctx.fillStyle = '#6D4C41';
      ctx.fillRect(185, 170, 22, 40);

      // Cây bên phải
      ctx.fillStyle = '#795548';
      ctx.fillRect(285, 160, 14, 60);
      ctx.fillStyle = '#26de81';
      ctx.beginPath();
      ctx.arc(292, 145, 28, 0, Math.PI*2);
      ctx.fill();

      // Quả táo trên cây (Điểm 5: Cây ở màn A có 3 quả đỏ, màn B có 2 quả)
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(285, 135, 4, 0, Math.PI*2);
      ctx.arc(302, 148, 4, 0, Math.PI*2);
      if (!isDiff) {
        ctx.arc(290, 155, 4, 0, Math.PI*2); // Quả thứ 3
      }
      ctx.fill();
    },
    // Vị trí 5 điểm khác biệt (x, y, bán kính nhận diện r)
    differences: [
      { id: 1, x: 60, y: 50, r: 25, hint: "Mặt trời góc trái" },
      { id: 2, x: 310, y: 52, r: 28, hint: "Đám mây góc trên bên phải" },
      { id: 3, x: 180, y: 115, r: 26, hint: "Màu sắc của mái nhà" },
      { id: 4, x: 160, y: 165, r: 18, hint: "Ô cửa sổ màu trắng" },
      { id: 5, x: 290, y: 155, r: 18, hint: "Quả táo màu đỏ trên tán cây" }
    ]
  },
  {
    // MÀN 2: Thuyền buồm ngoài biển
    drawBase: function(ctx, isDiff) {
      // Bầu trời
      ctx.fillStyle = '#ffbe76';
      ctx.fillRect(0, 0, 360, 170);
      // Biển
      ctx.fillStyle = '#0984e3';
      ctx.fillRect(0, 170, 360, 110);

      // Hải đăng (Điểm 1: Màn B đèn hải đăng phát sáng vàng)
      ctx.fillStyle = '#d63031';
      ctx.fillRect(40, 120, 20, 60);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(40, 135, 20, 12);
      if (isDiff) {
        // Ánh đèn hải đăng
        ctx.fillStyle = 'rgba(255, 234, 167, 0.85)';
        ctx.beginPath();
        ctx.moveTo(60, 125);
        ctx.lineTo(130, 95);
        ctx.lineTo(130, 150);
        ctx.fill();
      }

      // Thuyền buồm lớn
      ctx.fillStyle = '#6c5ce7'; // Thân thuyền
      ctx.beginPath();
      ctx.moveTo(170, 200);
      ctx.lineTo(260, 200);
      ctx.lineTo(240, 225);
      ctx.lineTo(190, 225);
      ctx.fill();

      // Cánh buồm (Điểm 2: Cánh buồm trắng vs cánh buồm sọc đỏ)
      ctx.fillStyle = isDiff ? '#ff7675' : '#ffffff';
      ctx.beginPath();
      ctx.moveTo(215, 140);
      ctx.lineTo(215, 195);
      ctx.lineTo(255, 195);
      ctx.fill();

      // Lá cờ đỉnh buồm (Điểm 3: Màn A có cờ, Màn B không có cờ)
      if (!isDiff) {
        ctx.fillStyle = '#e84393';
        ctx.beginPath();
        ctx.moveTo(215, 138);
        ctx.lineTo(228, 144);
        ctx.lineTo(215, 150);
        ctx.fill();
      }

      // Đàn hải âu (Điểm 4: Màn A có 3 con chim, Màn B có 2 con)
      ctx.strokeStyle = '#2d3436';
      ctx.lineWidth = 2;
      // Chim 1
      ctx.beginPath(); ctx.arc(120, 50, 8, Math.PI, 0); ctx.arc(136, 50, 8, Math.PI, 0); ctx.stroke();
      // Chim 2
      ctx.beginPath(); ctx.arc(160, 65, 6, Math.PI, 0); ctx.arc(172, 65, 6, Math.PI, 0); ctx.stroke();
      if (!isDiff) {
        // Chim thứ 3 chỉ có ở A
        ctx.beginPath(); ctx.arc(270, 45, 7, Math.PI, 0); ctx.arc(284, 45, 7, Math.PI, 0); ctx.stroke();
      }

      // Con cá nhảy lên khỏi mặt biển (Điểm 5: Màn B có chú cá heo con nhảy lên)
      if (isDiff) {
        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.arc(310, 185, 9, 0, Math.PI);
        ctx.fill();
      }
    },
    differences: [
      { id: 1, x: 90, y: 125, r: 25, hint: "Tia sáng đèn từ tháp hải đăng" },
      { id: 2, x: 235, y: 170, r: 24, hint: "Màu của cánh buồm thuyền" },
      { id: 3, x: 220, y: 144, r: 16, hint: "Lá cờ trên đỉnh cột buồm" },
      { id: 4, x: 277, y: 45, r: 18, hint: "Con chim hải âu góc trên" },
      { id: 5, x: 310, y: 185, r: 18, hint: "Mặt nước biển bên phải" }
    ]
  }
];

let foundList = [];

function loadLevel(lvl) {
  curLevel = lvl;
  foundList = [];
  levelEl.textContent = curLevel + 1;
  foundCountEl.textContent = 0;
  winModal.style.display = 'none';

  render();
}

function render() {
  const data = levels[curLevel];
  // Vẽ ảnh A và ảnh B
  data.drawBase(ctxA, false);
  data.drawBase(ctxB, true);

  // Vẽ các vòng tròn đỏ viền quanh các điểm đã tìm thấy
  foundList.forEach(diff => {
    drawFoundCircle(ctxA, diff.x, diff.y, diff.r);
    drawFoundCircle(ctxB, diff.x, diff.y, diff.r);
  });
}

function drawFoundCircle(ctx, x, y, r) {
  ctx.save();
  ctx.strokeStyle = '#ff4757';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, r + 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function checkClick(x, y) {
  const currentDiffs = levels[curLevel].differences;
  for (let diff of currentDiffs) {
    if (foundList.includes(diff)) continue;

    const dist = Math.hypot(x - diff.x, y - diff.y);
    if (dist <= diff.r + 10) {
      foundList.push(diff);
      foundCountEl.textContent = foundList.length;
      
      // Âm thanh chuông báo tìm đúng
      playSound(660, 0.1);
      setTimeout(() => playSound(880, 0.15), 100);

      render();

      // Kiểm tra hoàn thành màn
      if (foundList.length === currentDiffs.length) {
        setTimeout(showWin, 400);
      }
      return;
    }
  }
  // Bấm trượt
  playSound(220, 0.1, 'sawtooth');
}

function getCanvasCoords(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvasA.addEventListener('pointerdown', (e) => {
  const coords = getCanvasCoords(canvasA, e);
  checkClick(coords.x, coords.y);
});

canvasB.addEventListener('pointerdown', (e) => {
  const coords = getCanvasCoords(canvasB, e);
  checkClick(coords.x, coords.y);
});

// Nút gợi ý
hintBtn.addEventListener('click', () => {
  if (hintsLeft <= 0) {
    alert("Bạn đã hết lượt gợi ý!");
    return;
  }
  const unfound = levels[curLevel].differences.filter(d => !foundList.includes(d));
  if (unfound.length > 0) {
    hintsLeft--;
    hintBtn.textContent = `💡 Gợi ý (${hintsLeft})`;
    const target = unfound[0];
    
    // Nhấp nháy gợi ý
    ctxA.save();
    ctxB.save();
    ctxA.strokeStyle = ctxB.strokeStyle = '#ffa502';
    ctxA.lineWidth = ctxB.lineWidth = 3;
    ctxA.strokeRect(target.x - target.r, target.y - target.r, target.r * 2, target.r * 2);
    ctxB.strokeRect(target.x - target.r, target.y - target.r, target.r * 2, target.r * 2);
    ctxA.restore();
    ctxB.restore();

    playSound(520, 0.15);
  }
});

function showWin() {
  playSound(523, 0.15);
  setTimeout(() => playSound(659, 0.15), 150);
  setTimeout(() => playSound(784, 0.25), 300);

  if (curLevel + 1 < levels.length) {
    winMsg.textContent = "Bạn đã hoàn thành màn này xuất sắc!";
    btnNext.textContent = "Sang Màn Kế Tiếp ➔";
    btnNext.onclick = () => { loadLevel(curLevel + 1); };
  } else {
    winMsg.textContent = "🏆 CHÚC MỪNG BẠN ĐÃ PHÁ ĐẢO TOÀN BỘ TRÒ CHƠI!";
    btnNext.textContent = "Chơi Lại Từ Đầu ↺";
    btnNext.onclick = () => { loadLevel(0); };
  }
  winModal.style.display = 'block';
}

// Bộ đếm thời gian
function startTimer() {
  seconds = 0;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

// Khởi chạy
loadLevel(0);
startTimer();
</script>
</body>
</html>
