<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-Rex Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #f7f7f7;
    color: #535353;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    transition: background-color 0.8s, color 0.8s;
  }
  body.dark {
    background-color: #202124;
    color: #e8eaed;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: transparent;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    border-radius: 4px;
  }
  .controls-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 12px;
    font-size: 13px;
    font-weight: bold;
  }
  .touch-controls {
    display: none;
    margin-top: 15px;
    gap: 20px;
    width: 100%;
    justify-content: center;
  }
  .touch-btn {
    flex: 1;
    max-width: 160px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    background: #e0e0e0;
    color: #333;
    border: 2px solid #535353;
    border-radius: 8px;
    touch-action: manipulation;
  }
  .touch-btn:active {
    background: #bbb;
  }
  body.dark .touch-btn {
    background: #3c4043;
    color: #fff;
    border-color: #888;
  }
  body.dark .touch-btn:active {
    background: #555;
  }
  @media (pointer: coarse), (max-width: 768px) {
    .touch-controls { display: flex; }
    .hint-text { display: none; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="240"></canvas>
  <div class="controls-bar">
    <span class="hint-text">Nhấn <b>SPACE</b> hoặc <b>↑</b> để Nhảy | <b>↓</b> để Cúi</span>
    <span id="sound-btn" style="cursor: pointer;">🔊 Âm thanh: BẬT</span>
  </div>
  <div class="touch-controls">
    <button class="touch-btn" id="btn-duck">CÚI (DUCK)</button>
    <button class="touch-btn" id="btn-jump">NHẢY (JUMP)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const soundBtn = document.getElementById('sound-btn');
const btnJump = document.getElementById('btn-jump');
const btnDuck = document.getElementById('btn-duck');

let soundEnabled = true;
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Âm thanh: BẬT' : '🔈 Âm thanh: TẮT';
});

// Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBeep(freq, type, duration, delay = 0) {
  if (!soundEnabled) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  } catch (e) {}
}

const GROUND_Y = 200;
let speed = 6;
let score = 0;
let highScore = localStorage.getItem('dino_hi') || 0;
let isGameOver = false;
let isStarted = false;
let frameCount = 0;
let nightMode = false;

const dino = {
  x: 50,
  y: GROUND_Y - 47,
  w: 44,
  h: 47,
  dy: 0,
  gravity: 0.65,
  jumpPower: -11.5,
  isGrounded: true,
  isDucking: false,
  legState: 0
};

let obstacles = [];
let clouds = [
  { x: 300, y: 50, speed: 0.6 },
  { x: 650, y: 75, speed: 0.5 }
];
let groundOffset = 0;

function jump() {
  initAudio();
  if (isGameOver) { resetGame(); return; }
  if (!isStarted) { isStarted = true; }
  if (dino.isGrounded && !dino.isDucking) {
    dino.dy = dino.jumpPower;
    dino.isGrounded = false;
    playBeep(440, 'square', 0.1);
  }
}

function setDuck(val) {
  if (!isStarted || isGameOver) return;
  dino.isDucking = val;
  if (val && !dino.isGrounded) {
    dino.dy += 4; // Tăng tốc rơi
  }
}

// Bàn phím
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    setDuck(true);
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') setDuck(false);
});

// Cảm ứng nút ảo & Canvas
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnDuck.addEventListener('pointerdown', (e) => { e.preventDefault(); setDuck(true); });
btnDuck.addEventListener('pointerup', (e) => { e.preventDefault(); setDuck(false); });

function spawnObstacle() {
  const minGap = 200 + speed * 15;
  const lastObs = obstacles[obstacles.length - 1];
  if (lastObs && canvas.width - lastObs.x < minGap) return;

  const rand = Math.random();
  if (score > 250 && rand < 0.28) {
    // Chim Pterodactyl
    const flightHeights = [GROUND_Y - 30, GROUND_Y - 55, GROUND_Y - 75];
    obstacles.push({
      type: 'bird',
      x: canvas.width,
      y: flightHeights[Math.floor(Math.random() * flightHeights.length)],
      w: 42,
      h: 30,
      flap: 0
    });
  } else {
    // Xương rồng
    const cTypes = [
      { w: 18, h: 40, y: GROUND_Y - 40 },
      { w: 34, h: 42, y: GROUND_Y - 42 },
      { w: 24, h: 50, y: GROUND_Y - 50 }
    ];
    const picked = cTypes[Math.floor(Math.random() * cTypes.length)];
    obstacles.push({
      type: 'cactus',
      x: canvas.width,
      y: picked.y,
      w: picked.w,
      h: picked.h
    });
  }
}

function update() {
  if (!isStarted || isGameOver) return;
  frameCount++;

  // Vật lý khủng long
  dino.dy += dino.gravity;
  dino.y += dino.dy;
  const currentHeight = dino.isDucking ? 30 : 47;
  const currentWidth = dino.isDucking ? 59 : 44;

  if (dino.y >= GROUND_Y - currentHeight) {
    dino.y = GROUND_Y - currentHeight;
    dino.dy = 0;
    dino.isGrounded = true;
  }

  if (frameCount % 6 === 0) {
    dino.legState = 1 - dino.legState;
  }

  // Tăng điểm và tốc độ
  if (frameCount % 4 === 0) {
    score++;
    if (score % 100 === 0) {
      playBeep(880, 'square', 0.08);
      setTimeout(() => playBeep(1100, 'square', 0.12), 90);
    }
    if (score % 400 === 0) {
      nightMode = !nightMode;
      document.body.classList.toggle('dark', nightMode);
    }
  }
  speed = 6 + Math.min(score * 0.005, 9);

  // Cuộn mặt đất & Mây
  groundOffset = (groundOffset + speed) % 24;
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -60) { c.x = canvas.width + 40; c.y = 30 + Math.random() * 60; }
  });

  // Chướng ngại vật
  if (Math.random() < 0.035) spawnObstacle();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.x -= speed;
    if (ob.type === 'bird' && frameCount % 12 === 0) {
      ob.flap = 1 - ob.flap;
    }

    // Kiểm tra va chạm (AABB thu hẹp vùng tiếp xúc)
    const dHitBox = {
      x: dino.x + 8,
      y: dino.y + 4,
      w: currentWidth - 14,
      h: currentHeight - 6
    };
    const oHitBox = {
      x: ob.x + 4,
      y: ob.y + 4,
      w: ob.w - 8,
      h: ob.h - 6
    };

    if (
      dHitBox.x < oHitBox.x + oHitBox.w &&
      dHitBox.x + dHitBox.w > oHitBox.x &&
      dHitBox.y < oHitBox.y + oHitBox.h &&
      dHitBox.y + dHitBox.h > oHitBox.y
    ) {
      gameOver();
    }

    if (ob.x + ob.w < -10) obstacles.splice(i, 1);
  }
}

function gameOver() {
  isGameOver = true;
  playBeep(200, 'sawtooth', 0.25);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dino_hi', highScore);
  }
}

function resetGame() {
  obstacles = [];
  score = 0;
  speed = 6;
  isGameOver = false;
  frameCount = 0;
  dino.y = GROUND_Y - 47;
  dino.dy = 0;
  dino.isGrounded = true;
  dino.isDucking = false;
  nightMode = false;
  document.body.classList.remove('dark');
}

// Vẽ đồ họa
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const color = nightMode ? '#e8eaed' : '#535353';
  ctx.fillStyle = color;

  // 1. Mây
  clouds.forEach(c => {
    ctx.fillRect(c.x, c.y, 46, 12);
    ctx.fillRect(c.x + 12, c.y - 7, 24, 7);
  });

  // 2. Mặt đất
  ctx.fillRect(0, GROUND_Y, canvas.width, 2);
  for (let x = -groundOffset; x < canvas.width; x += 24) {
    if ((x * 7) % 5 === 0) ctx.fillRect(x + 2, GROUND_Y + 4, 3, 2);
    if ((x * 11) % 7 === 0) ctx.fillRect(x + 10, GROUND_Y + 8, 5, 2);
  }

  // 3. Khủng long
  if (!dino.isDucking) {
    // Đứng/Nhảy/Chạy
    ctx.fillRect(dino.x + 16, dino.y, 24, 18); // Đầu
    ctx.fillRect(dino.x + 12, dino.y + 14, 28, 20); // Thân
    ctx.fillRect(dino.x + 2, dino.y + 18, 12, 14); // Đuôi
    ctx.fillRect(dino.x + 36, dino.y + 24, 8, 4); // Tay
    // Mắt
    ctx.fillStyle = nightMode ? '#202124' : '#f7f7f7';
    ctx.fillRect(dino.x + 22, dino.y + 4, 4, 4);
    ctx.fillStyle = color;

    // Chân
    if (!dino.isGrounded || isGameOver) {
      ctx.fillRect(dino.x + 16, dino.y + 34, 4, 12);
      ctx.fillRect(dino.x + 26, dino.y + 34, 4, 12);
    } else {
      if (dino.legState === 0) {
        ctx.fillRect(dino.x + 16, dino.y + 34, 4, 13);
        ctx.fillRect(dino.x + 26, dino.y + 34, 6, 8);
      } else {
        ctx.fillRect(dino.x + 16, dino.y + 34, 6, 8);
        ctx.fillRect(dino.x + 26, dino.y + 34, 4, 13);
      }
    }
  } else {
    // Cúi người
    ctx.fillRect(dino.x, dino.y + 8, 16, 12); // Đuôi
    ctx.fillRect(dino.x + 14, dino.y + 6, 30, 16); // Thân nằm
    ctx.fillRect(dino.x + 40, dino.y, 19, 14); // Đầu cúi
    ctx.fillStyle = nightMode ? '#202124' : '#f7f7f7';
    ctx.fillRect(dino.x + 46, dino.y + 3, 3, 3); // Mắt
    ctx.fillStyle = color;

    if (dino.legState === 0) {
      ctx.fillRect(dino.x + 20, dino.y + 22, 4, 8);
      ctx.fillRect(dino.x + 32, dino.y + 22, 6, 5);
    } else {
      ctx.fillRect(dino.x + 20, dino.y + 22, 6, 5);
      ctx.fillRect(dino.x + 32, dino.y + 22, 4, 8);
    }
  }

  // 4. Chướng ngại vật
  obstacles.forEach(ob => {
    if (ob.type === 'cactus') {
      ctx.fillRect(ob.x + ob.w / 2 - 3, ob.y, 6, ob.h);
      ctx.fillRect(ob.x, ob.y + 10, ob.w, 4);
      ctx.fillRect(ob.x, ob.y + 6, 4, 8);
      ctx.fillRect(ob.x + ob.w - 4, ob.y + 6, 4, 8);
    } else if (ob.type === 'bird') {
      ctx.fillRect(ob.x + 8, ob.y + 10, 24, 10);
      ctx.fillRect(ob.x, ob.y + 12, 10, 6);
      if (ob.flap === 0) {
        ctx.fillRect(ob.x + 14, ob.y, 8, 12);
      } else {
        ctx.fillRect(ob.x + 14, ob.y + 16, 8, 12);
      }
    }
  });

  // 5. Điểm số
  ctx.font = '16px "Courier New", Courier, monospace';
  ctx.textAlign = 'right';
  const scoreStr = String(score).padStart(5, '0');
  const hiStr = String(highScore).padStart(5, '0');
  ctx.fillText(`HI ${hiStr}  ${scoreStr}`, canvas.width - 15, 25);

  // Màn hình Game Over / Bắt đầu
  if (!isStarted) {
    ctx.textAlign = 'center';
    ctx.fillText('NHẤN PHÍM CÁCH HOẶC CHẠM MÀN HÌNH ĐỂ CHƠI', canvas.width / 2, GROUND_Y - 60);
  } else if (isGameOver) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", Courier, monospace';
    ctx.fillText('G A M E   O V E R', canvas.width / 2, GROUND_Y - 70);
    ctx.font = '14px "Courier New", Courier, monospace';
    ctx.fillText('↺ Nhấn Phím Cách hoặc chạm màn hình để chơi lại', canvas.width / 2, GROUND_Y - 40);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
