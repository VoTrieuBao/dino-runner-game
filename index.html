<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-Rex Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #f7f7f7;
    color: #535353;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    transition: background-color 0.8s, color 0.8s;
  }
  body.dark {
    background-color: #202124;
    color: #e8eaed;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    background: transparent;
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
  .controls-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 10px;
    font-size: 13px;
    font-weight: bold;
  }
  .touch-controls {
    display: none;
    margin-top: 15px;
    gap: 20px;
    width: 100%;
    justify-content: center;
  }
  .touch-btn {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    background: #e0e0e0;
    color: #333;
    border: 2px solid #535353;
    border-radius: 8px;
    touch-action: manipulation;
  }
  .touch-btn:active { background: #bbb; }
  body.dark .touch-btn { background: #3c4043; color: #fff; border-color: #888; }
  body.dark .touch-btn:active { background: #555; }
  @media (pointer: coarse), (max-width: 768px) {
    .touch-controls { display: flex; }
    .hint-text { display: none; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="240"></canvas>
  <div class="controls-bar">
    <span class="hint-text">Nhấn <b>SPACE</b> / <b>↑</b>: Nhảy | <b>↓</b>: Cúi</span>
    <span id="sound-btn" style="cursor: pointer;">🔊 Âm thanh: BẬT</span>
  </div>
  <div class="touch-controls">
    <button class="touch-btn" id="btn-duck">CÚI (DUCK)</button>
    <button class="touch-btn" id="btn-jump">NHẢY (JUMP)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const soundBtn = document.getElementById('sound-btn');
const btnJump = document.getElementById('btn-jump');
const btnDuck = document.getElementById('btn-duck');

let soundEnabled = true;
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Âm thanh: BẬT' : '🔈 Âm thanh: TẮT';
});

// Audio Web API
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBeep(freq, type, duration, delay = 0) {
  if (!soundEnabled) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  } catch (e) {}
}

const GROUND_Y = 195;
let speed = 6;
let score = 0;
let highScore = localStorage.getItem('dino_hi') || 0;
let isGameOver = false;
let isStarted = false;
let frameCount = 0;
let nightMode = false;

// Sprite Pixel Maps chuẩn của Google T-Rex
// 1 = Pixel thân, 2 = Mắt trắng, 0 = trong suốt
const DINO_RUN_1 = [
  "............xxxxxxxxx",
  "............xxxxxxxxxx",
  "............xx2xxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxx..",
  "............xxxxxxxxx.",
  "x...........xxxxxx....",
  "xx.........xxxxxxx....",
  "xxx.......xxxxxxxxx...",
  "xxxx.....xxxxxxxxxxxx.",
  "xxxxx...xxxxxxxxxxxx..",
  "xxxxxxxxxxxxxxxxxx....",
  ".xxxxxxxxxxxxxxxx.....",
  "..xxxxxxxxxxxxxx......",
  "...xxxxxxxxxxxx.......",
  "....xxxxxxxxxx........",
  ".....xxxxxxxxx........",
  "......xxxxxx..........",
  ".......x...x..........",
  ".......xx..xx.........",
  ".......xx.............",
  ".......x.............."
];

const DINO_RUN_2 = [
  "............xxxxxxxxx",
  "............xxxxxxxxxx",
  "............xx2xxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxx..",
  "............xxxxxxxxx.",
  "x...........xxxxxx....",
  "xx.........xxxxxxx....",
  "xxx.......xxxxxxxxx...",
  "xxxx.....xxxxxxxxxxxx.",
  "xxxxx...xxxxxxxxxxxx..",
  "xxxxxxxxxxxxxxxxxx....",
  ".xxxxxxxxxxxxxxxx.....",
  "..xxxxxxxxxxxxxx......",
  "...xxxxxxxxxxxx.......",
  "....xxxxxxxxxx........",
  ".....xxxxxxxxx........",
  "......xxxxxx..........",
  ".......x...x..........",
  "......xx...x..........",
  "...........xx.........",
  "............x........."
];

const DINO_DEAD = [
  "............xxxxxxxxx",
  "............xxxxxxxxxx",
  "............xx.xxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxxxx",
  "............xxxxxxxx..",
  "............xxxxxxxxx.",
  "x...........xxxxxx....",
  "xx.........xxxxxxx....",
  "xxx.......xxxxxxxxx...",
  "xxxx.....xxxxxxxxxxxx.",
  "xxxxx...xxxxxxxxxxxx..",
  "xxxxxxxxxxxxxxxxxx....",
  ".xxxxxxxxxxxxxxxx.....",
  "..xxxxxxxxxxxxxx......",
  "...xxxxxxxxxxxx.......",
  "....xxxxxxxxxx........",
  ".....xxxxxxxxx........",
  "......xxxxxx..........",
  ".......x...x..........",
  ".......xx..xx.........",
  ".......xx..xx.........",
  ".......x....x........."
];

const DINO_DUCK_1 = [
  "...................xxxxxxxxxxxx",
  "...................xxxxxxxxxxxxx",
  "...................xx2xxxxxxxxxx",
  "...................xxxxxxxxxxxxx",
  "xxxx...............xxxxxxxxxxxxx",
  "xxxxxx............xxxxxxxxxxx...",
  "xxxxxxxx.xxxxxxxxxxxxxxxxxxxx...",
  ".xxxxxxxxxxxxxxxxxxxxxxxxxxx....",
  "..xxxxxxxxxxxxxxxxxxxxxxxxx.....",
  "...xxxxxxxxxxxxxxxxxxx..........",
  "....xxxxxxxxxxxxxxxxx...........",
  ".....xxxxxx....xxxxxx...........",
  "......x...x.....x...x...........",
  "......xx..x.....xx..x...........",
  "......xx............x..........."
];

const DINO_DUCK_2 = [
  "...................xxxxxxxxxxxx",
  "...................xxxxxxxxxxxxx",
  "...................xx2xxxxxxxxxx",
  "...................xxxxxxxxxxxxx",
  "xxxx...............xxxxxxxxxxxxx",
  "xxxxxx............xxxxxxxxxxx...",
  "xxxxxxxx.xxxxxxxxxxxxxxxxxxxx...",
  ".xxxxxxxxxxxxxxxxxxxxxxxxxxx....",
  "..xxxxxxxxxxxxxxxxxxxxxxxxx.....",
  "...xxxxxxxxxxxxxxxxxxx..........",
  "....xxxxxxxxxxxxxxxxx...........",
  ".....xxxxxx....xxxxxx...........",
  "......x...x.....x...x...........",
  "......x...xx....x...xx..........",
  "..........xx........x..........."
];

const CACTUS_SPRITE = [
  "..xx....xx..",
  "..xx....xx..",
  "..xx....xx..",
  "xxxx....xxxx",
  "xxxx....xxxx",
  "xxxx....xxxx",
  "xxxx....xxxx",
  ".xxxxxxxxxx.",
  "...xxxxxx...",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx....",
  "....xxxx...."
];

function drawPixelMap(map, startX, startY, scale, color, bgCol) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const char = row[c];
      if (char === 'x') {
        ctx.fillStyle = color;
        ctx.fillRect(startX + c * scale, startY + r * scale, scale, scale);
      } else if (char === '2') {
        ctx.fillStyle = bgCol;
        ctx.fillRect(startX + c * scale, startY + r * scale, scale, scale);
      }
    }
  }
}

const SCALE = 2.2;
const DINO_HEIGHT = 23 * SCALE;
const DINO_WIDTH = 21 * SCALE;
const DUCK_HEIGHT = 15 * SCALE;

const dino = {
  x: 50,
  y: GROUND_Y - DINO_HEIGHT,
  dy: 0,
  gravity: 0.65,
  jumpPower: -11.5,
  isGrounded: true,
  isDucking: false,
  legState: 0
};

let obstacles = [];
let clouds = [
  { x: 300, y: 40, speed: 0.5 },
  { x: 620, y: 70, speed: 0.4 }
];
let groundOffset = 0;

function jump() {
  initAudio();
  if (isGameOver) { resetGame(); return; }
  if (!isStarted) { isStarted = true; }
  if (dino.isGrounded && !dino.isDucking) {
    dino.dy = dino.jumpPower;
    dino.isGrounded = false;
    playBeep(440, 'square', 0.09);
  }
}

function setDuck(val) {
  if (!isStarted || isGameOver) return;
  dino.isDucking = val;
  if (val && !dino.isGrounded) {
    dino.dy += 4;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    setDuck(true);
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') setDuck(false);
});

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
btnDuck.addEventListener('pointerdown', (e) => { e.preventDefault(); setDuck(true); });
btnDuck.addEventListener('pointerup', (e) => { e.preventDefault(); setDuck(false); });

function spawnObstacle() {
  const minGap = 200 + speed * 14;
  const lastObs = obstacles[obstacles.length - 1];
  if (lastObs && canvas.width - lastObs.x < minGap) return;

  const rand = Math.random();
  if (score > 250 && rand < 0.3) {
    const flightHeights = [GROUND_Y - 25, GROUND_Y - 50, GROUND_Y - 70];
    obstacles.push({
      type: 'bird',
      x: canvas.width,
      y: flightHeights[Math.floor(Math.random() * flightHeights.length)],
      w: 36,
      h: 24,
      flap: 0
    });
  } else {
    obstacles.push({
      type: 'cactus',
      x: canvas.width,
      y: GROUND_Y - (19 * SCALE),
      w: 12 * SCALE,
      h: 19 * SCALE
    });
  }
}

function update() {
  if (!isStarted || isGameOver) return;
  frameCount++;

  dino.dy += dino.gravity;
  dino.y += dino.dy;

  const curH = dino.isDucking ? DUCK_HEIGHT : DINO_HEIGHT;

  if (dino.y >= GROUND_Y - curH) {
    dino.y = GROUND_Y - curH;
    dino.dy = 0;
    dino.isGrounded = true;
  }

  if (frameCount % 6 === 0) {
    dino.legState = 1 - dino.legState;
  }

  if (frameCount % 4 === 0) {
    score++;
    if (score % 100 === 0) {
      playBeep(880, 'square', 0.08);
      setTimeout(() => playBeep(1100, 'square', 0.12), 90);
    }
    if (score % 400 === 0) {
      nightMode = !nightMode;
      document.body.classList.toggle('dark', nightMode);
    }
  }
  speed = 6 + Math.min(score * 0.005, 8.5);

  groundOffset = (groundOffset + speed) % 24;
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -60) { c.x = canvas.width + 40; c.y = 25 + Math.random() * 50; }
  });

  if (Math.random() < 0.035) spawnObstacle();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.x -= speed;
    if (ob.type === 'bird' && frameCount % 12 === 0) {
      ob.flap = 1 - ob.flap;
    }

    const curW = dino.isDucking ? 32 * SCALE : DINO_WIDTH;
    const dHitBox = { x: dino.x + 8, y: dino.y + 4, w: curW - 14, h: curH - 6 };
    const oHitBox = { x: ob.x + 4, y: ob.y + 4, w: ob.w - 8, h: ob.h - 6 };

    if (
      dHitBox.x < oHitBox.x + oHitBox.w &&
      dHitBox.x + dHitBox.w > oHitBox.x &&
      dHitBox.y < oHitBox.y + oHitBox.h &&
      dHitBox.y + dHitBox.h > oHitBox.y
    ) {
      gameOver();
    }

    if (ob.x + ob.w < -10) obstacles.splice(i, 1);
  }
}

function gameOver() {
  isGameOver = true;
  playBeep(180, 'sawtooth', 0.25);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dino_hi', highScore);
  }
}

function resetGame() {
  obstacles = [];
  score = 0;
  speed = 6;
  isGameOver = false;
  frameCount = 0;
  dino.y = GROUND_Y - DINO_HEIGHT;
  dino.dy = 0;
  dino.isGrounded = true;
  dino.isDucking = false;
  nightMode = false;
  document.body.classList.remove('dark');
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const color = nightMode ? '#e8eaed' : '#535353';
  const bgCol = nightMode ? '#202124' : '#f7f7f7';

  // 1. Mây
  ctx.fillStyle = color;
  clouds.forEach(c => {
    ctx.fillRect(c.x, c.y, 44, 10);
    ctx.fillRect(c.x + 12, c.y - 6, 22, 6);
  });

  // 2. Mặt đất
  ctx.fillRect(0, GROUND_Y, canvas.width, 2);
  for (let x = -groundOffset; x < canvas.width; x += 24) {
    if ((x * 7) % 5 === 0) ctx.fillRect(x + 2, GROUND_Y + 4, 3, 2);
    if ((x * 11) % 7 === 0) ctx.fillRect(x + 10, GROUND_Y + 8, 4, 2);
  }

  // 3. Khủng long chuẩn Pixel Art
  if (isGameOver) {
    drawPixelMap(DINO_DEAD, dino.x, dino.y, SCALE, color, bgCol);
  } else if (dino.isDucking) {
    drawPixelMap(dino.legState === 0 ? DINO_DUCK_1 : DINO_DUCK_2, dino.x, dino.y, SCALE, color, bgCol);
  } else if (!dino.isGrounded) {
    drawPixelMap(DINO_RUN_1, dino.x, dino.y, SCALE, color, bgCol);
  } else {
    drawPixelMap(dino.legState === 0 ? DINO_RUN_1 : DINO_RUN_2, dino.x, dino.y, SCALE, color, bgCol);
  }

  // 4. Chướng ngại vật
  obstacles.forEach(ob => {
    if (ob.type === 'cactus') {
      drawPixelMap(CACTUS_SPRITE, ob.x, ob.y, SCALE, color, bgCol);
    } else if (ob.type === 'bird') {
      ctx.fillStyle = color;
      ctx.fillRect(ob.x + 6, ob.y + 8, 24, 8);
      ctx.fillRect(ob.x, ob.y + 10, 8, 6);
      if (ob.flap === 0) {
        ctx.fillRect(ob.x + 12, ob.y - 2, 8, 10);
      } else {
        ctx.fillRect(ob.x + 12, ob.y + 14, 8, 10);
      }
    }
  });

  // 5. Điểm số
  ctx.fillStyle = color;
  ctx.font = '16px "Courier New", Courier, monospace';
  ctx.textAlign = 'right';
  const scoreStr = String(score).padStart(5, '0');
  const hiStr = String(highScore).padStart(5, '0');
  ctx.fillText(`HI ${hiStr}  ${scoreStr}`, canvas.width - 15, 25);

  if (!isStarted) {
    ctx.textAlign = 'center';
    ctx.fillText('NHẤN PHÍM CÁCH HOẶC CHẠM MÀN HÌNH ĐỂ BẮT ĐẦU', canvas.width / 2, GROUND_Y - 60);
  } else if (isGameOver) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", Courier, monospace';
    ctx.fillText('G A M E   O V E R', canvas.width / 2, GROUND_Y - 70);
    ctx.font = '14px "Courier New", Courier, monospace';
    ctx.fillText('↺ Nhấn Phím Cách hoặc chạm màn hình để chơi lại', canvas.width / 2, GROUND_Y - 40);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
